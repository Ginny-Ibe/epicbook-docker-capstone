name: Build, push and deploy EpicBook

on:
  push:
    branches: [capstone/epicbook-docker]
    paths:
      - "backend/**"
      - "frontend/**"
      - "proxy/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never run two deploys to the same VM at once
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Not secret: these identify resources but grant nothing on their own.
# The only real secret is EC2_SSH_KEY (repository secret).
env:
  IMAGE_PREFIX: ghcr.io/ginny-ibe/
  AWS_ROLE_ARN: arn:aws:iam::521681798359:role/epicbook-ci-deploy
  SG_ID: sg-00bbb0a58deb6b166
  EC2_HOST: 3.92.87.219
  EC2_KNOWN_HOSTS: "3.92.87.219 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILmHu1PaMoFfASaZ67Bnzr41mLF+KbBjlsZiLor7hjG/"

jobs:
  # ---------------------------------------------------------
  # 1. Build both images and push them to GHCR, tagged with the commit SHA
  # ---------------------------------------------------------
  build-push:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t ${IMAGE_PREFIX}epicbook-${{ matrix.service }}:${{ github.sha }} \
            -t ${IMAGE_PREFIX}epicbook-${{ matrix.service }}:latest \
            ./${{ matrix.service }}
          docker image ls ${IMAGE_PREFIX}epicbook-${{ matrix.service }}

      - name: Push image
        run: docker push --all-tags ${IMAGE_PREFIX}epicbook-${{ matrix.service }}

  # ---------------------------------------------------------
  # 2. Deploy to the EC2 VM (waits for manual approval on "production")
  # ---------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write # OIDC token for AWS, no stored AWS keys
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # SSH is locked to the admin IP; open it to this runner only, for this run only
      - name: Allow this runner's IP on port 22
        id: sg
        run: |
          ip=$(curl -s https://checkip.amazonaws.com)
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${ip}/32,Description=github-actions-${{ github.run_id }}}]"
          echo "cidr=${ip}/32" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key and pinned host key
        run: |
          install -m 700 -d ~/.ssh
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Repository secret EC2_SSH_KEY is missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Pull new images and restart the stack
        env:
          HOST: ${{ env.EC2_HOST }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes ubuntu@"$HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/epicbook-docker-capstone

          # Same commit as the images: compose file and nginx.conf stay in sync
          git fetch --quiet origin
          git checkout --quiet --detach "$SHA"

          # Point compose at the GHCR images for this commit (.env is never in Git)
          sed -i '/^IMAGE_PREFIX=/d;/^IMAGE_TAG=/d' .env
          printf 'IMAGE_PREFIX=%s\nIMAGE_TAG=%s\n' "$IMAGE_PREFIX" "$SHA" >> .env

          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker compose pull frontend backend
          docker compose up -d --no-build --wait --wait-timeout 180
          # nginx.conf is bind-mounted, so a changed config is NOT picked up by
          # "up" alone (image/settings unchanged). Recreate the proxy every deploy.
          docker compose up -d --no-build --no-deps --force-recreate --wait --wait-timeout 60 reverse-proxy
          docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}'
          EOF

      - name: Remove this runner's IP from port 22
        if: always() && steps.sg.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.sg.outputs.cidr }}"
          rm -f ~/.ssh/deploy_key

  # ---------------------------------------------------------
  # 3. Verify through the public reverse proxy
  # ---------------------------------------------------------
  verify:
    name: Verify public endpoints
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check and home page
        env:
          HOST: ${{ env.EC2_HOST }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST/health")
            echo "attempt $i: /health -> $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ]
          curl -sf "http://$HOST/" | grep -q "Deployed by Ginny Ibe"
          echo "Home page OK: EpicBook is serving through the reverse proxy"
          # Static assets come from the frontend container via the proxy;
          # catches a proxy -> frontend mismatch (e.g. 502) that /health misses
          curl -sf -o /dev/null "http://$HOST/assets/css/style.css"
          echo "Assets OK: frontend is reachable through the reverse proxy"
