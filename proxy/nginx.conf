# EpicBook reverse proxy — the ONLY public entry point (port 80)
# Author: Ginny Ibe


# Structured JSON access log. Deliberately logs $uri (path only, NOT the query
# string) and no headers/cookies, so tokens or passwords can never end up in logs.
log_format json_safe escape=json
  '{'
    '"time":"$time_iso8601",'
    '"client_ip":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"protocol":"$server_protocol",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
  '}';


server {
    listen 80;
    server_name _;
    server_tokens off;                      # hide the Nginx version in responses
 
    access_log /var/log/nginx/access.log json_safe;
    error_log  /var/log/nginx/error.log  warn;

    # Docker's internal DNS. Re-resolve service names every 10s so that a
    # recreated container (new IP) is found again instead of a stale IP -> 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend  http://backend:8080;
    set $frontend http://frontend:8080;

    # Headers passed to the upstream on every proxied request
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Proxy's own liveness check (used by the reverse-proxy healthcheck)
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }

    # 2. Health endpoint -> backend /health
    location = /health {
        proxy_pass $backend;
    }

    # 3. API requests -> backend (same origin, so no CORS headers needed)
    location /api/ {
        proxy_pass $backend;
    }

    # 4. Static frontend assets (CSS, JS, images) -> frontend Nginx
    location /assets/ {
        proxy_pass $frontend;
        expires 7d;                         # let browsers cache static files
    }

    # 5. Application pages (/, /cart, /gallery, /category/...) -> backend
    location / {
        proxy_pass $backend;
    }
}

