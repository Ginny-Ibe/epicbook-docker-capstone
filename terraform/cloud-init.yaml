#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git

runcmd:
  # 2 GB swap: t3.micro has 1 GB RAM, MySQL 8 + image builds need more
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # Docker Engine + Compose plugin from Docker's official repository
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - systemctl enable --now docker
  - usermod -aG docker ubuntu

  # Marker file so we can confirm bootstrap finished
  - echo "bootstrap complete $(date -Is)" > /var/log/epicbook-bootstrap.done
