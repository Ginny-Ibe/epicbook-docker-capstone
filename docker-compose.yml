# Shared log settings: Docker's json-file driver with rotation,
# so stdout logs can't fill the disk (3 files x 10 MB per container)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"                     # the ONLY published port in the stack
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs/nginx:/var/log/nginx          # proxy logs persisted on the host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - front-tier
    logging: *default-logging
    restart: unless-stopped

  frontend:
    build: ./frontend
    # Local: epicbook-frontend:1.0. CI/CD sets IMAGE_PREFIX/IMAGE_TAG in .env on the VM
    # so it runs ghcr.io/ginny-ibe/epicbook-frontend:<git-sha> instead.
    image: ${IMAGE_PREFIX:-}epicbook-frontend:${IMAGE_TAG:-1.0}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/assets/css/style.css"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - front-tier
    logging: *default-logging
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${IMAGE_PREFIX:-}epicbook-backend:${IMAGE_TAG:-1.0}
    # Tiny init as PID 1 forwards SIGTERM to node, so stops are graceful (no 10s wait / exit 137)
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      JAWSDB_URL: mysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      database:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    logging: *default-logging
    restart: unless-stopped

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      # $$ = read the variable INSIDE the container, so the password never
      # appears in `docker inspect`. -h 127.0.0.1 forces a TCP check, which
      # only passes once MySQL has finished its first-time init.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
      - ./db/BuyTheBook_Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/author_seed.sql:/docker-entrypoint-initdb.d/02-authors.sql:ro
      - ./db/books_seed.sql:/docker-entrypoint-initdb.d/03-books.sql:ro
    networks:
      - back-tier
    logging: *default-logging
    restart: unless-stopped

networks:
  front-tier:
  back-tier:
    internal: true                  # no route to the internet or host

volumes:
  db_data:
